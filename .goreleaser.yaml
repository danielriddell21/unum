version: 2

project_name: unum

before:
  hooks:
    - go mod tidy

builds:
  - id: unum
    main: ./cmd/unum
    binary: unum
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X github.com/danielriddell21/unum/internal/telemetry.otelAuthToken={{.Env.OTEL_AUTH_TOKEN}} -X github.com/danielriddell21/unum/internal/telemetry.otelEndpoint={{.Env.OTEL_ENDPOINT}}

archives:
  - id: unum
    builds: [unum]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

dockers:
  - goos: linux
    goarch: amd64
    ids: [unum]
    dockerfile: Dockerfile
    image_templates:
      - "ghcr.io/danielriddell21/unum:{{ .Tag }}"
      - "ghcr.io/danielriddell21/unum:edge"
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/danielriddell21/unum"

release:
  github:
    owner: danielriddell21
    name: unum
  name_template: "v{{ .Version }}"

brews:
  - name: unum
    repository:
      owner: danielriddell21
      name: homebrew-tap
      branch: trunk
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/danielriddell21/unum
    description: "A unified developer tool suite — JSON analysis, type generation, and more"
    license: MIT
    commit_msg_template: "Brew formula update for unum {{ .Tag }}"
    install: |
      bin.install "unum"
    test: |
      system "#{bin}/unum", "--version"


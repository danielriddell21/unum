<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>unum — JSON Explorer</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    #upload-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    #drop-zone {
      border: 2px dashed var(--border-active);
      border-radius: 6px;
      padding: 56px 80px;
      text-align: center;
      cursor: pointer;
      transition: background 0.15s;
      max-width: 480px;
      width: 100%;
    }

    #drop-zone:hover,
    #drop-zone.drag-over {
      background: var(--bg-hover);
    }

    .drop-title {
      color: var(--border-active);
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .drop-hint {
      color: var(--muted);
      font-size: 12px;
    }

    #upload-error {
      color: #E06C75;
      font-size: 12px;
      margin-top: 16px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="header">
    <span class="brand">[ UNUM ]</span>
    <span class="filename">json explorer</span>
    <div class="stats">
      <span>upload a .json file to explore</span>
    </div>
  </div>

  <div id="upload-wrap">
    <div>
      <div id="drop-zone">
        <div class="drop-title">drop .json file here</div>
        <div class="drop-hint">or click to browse</div>
        <input id="file-input" type="file" accept=".json,application/json" style="display:none" />
      </div>
      <div id="upload-error"></div>
    </div>
  </div>

  <div id="status-bar">
    <span></span>
    <span id="status-hints">click or drag a .json file to begin</span>
  </div>

  <script>
  (function () {
    'use strict';

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const errEl = document.getElementById('upload-error');

    // Apply saved theme
    const THEMES = {
      cyber:   { '--bg': '#0D0D0D', '--bg-panel': '#111111', '--bg-hover': '#1A1A2E', '--border': '#1E1E1E', '--border-active': '#00D4FF', '--text': '#C0C0C0', '--muted': '#3A3A3A' },
      matrix:  { '--bg': '#0D0D0D', '--bg-panel': '#0A1A0A', '--bg-hover': '#001A00', '--border': '#003300', '--border-active': '#00FF41', '--text': '#00CC22', '--muted': '#005500' },
      dracula: { '--bg': '#282A36', '--bg-panel': '#21222C', '--bg-hover': '#44475A', '--border': '#3D4050', '--border-active': '#BD93F9', '--text': '#F8F8F2', '--muted': '#6272A4' },
      nord:    { '--bg': '#2E3440', '--bg-panel': '#272C36', '--bg-hover': '#3B4252', '--border': '#3B4252', '--border-active': '#88C0D0', '--text': '#ECEFF4', '--muted': '#4C566A' },
    };
    const saved = localStorage.getItem('unum-theme') || 'cyber';
    const vars = THEMES[saved] || THEMES.cyber;
    for (const [k, v] of Object.entries(vars)) {
      document.documentElement.style.setProperty(k, v);
    }

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (file) handleFile(file);
    });

    function handleFile(file) {
      errEl.textContent = '';
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const resp = await fetch('/api/upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: file.name, content: e.target.result }),
          });
          if (!resp.ok) {
            const msg = await resp.text();
            throw new Error(msg.trim() || resp.statusText);
          }
          const { key } = await resp.json();
          window.location.href = '/explore?key=' + encodeURIComponent(key);
        } catch (err) {
          errEl.textContent = '✗ ' + err.message;
        }
      };
      reader.onerror = () => { errEl.textContent = '✗ failed to read file'; };
      reader.readAsText(file);
    }
  })();
  </script>
</body>
</html>

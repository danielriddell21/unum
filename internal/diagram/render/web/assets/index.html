<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>unum — Diagram Renderer</title>
  <link rel="stylesheet" href="/shared.css" />
  <link rel="stylesheet" href="/style.css" />
  <script>window.UNUM_CONFIG={darkTheme:"{{.DarkTheme}}",lightTheme:"{{.LightTheme}}",version:"{{.Version}}",themes:{{.ThemeData}}};</script>
  <script>window.DIAGRAM_CONFIG={lang:"{{.Lang}}",file:"{{.File}}",source:{{.SourceJSON}}};</script>
  <script src="/shared.js"></script>
  {{if .UmamiEnabled}}<script defer src="/umami/script.js" data-website-id="{{.UmamiWebsiteID}}"></script>{{end}}
</head>
<body>

  <div id="header">
    <span class="brand">[ UNUM ]</span>
    <span class="hdr-tool">diagram renderer</span>
    <span class="hdr-sep" id="sep-file" style="display:none">·</span>
    <span class="hdr-info" id="hdr-filename"></span>
    <span class="hdr-sep" id="sep-meta" style="display:none">·</span>
    <span class="hdr-info" id="hdr-meta"></span>
  </div>

  <!-- Upload screen: the initial empty state, consistent with the json and diff web UIs -->
  <div id="upload-panel" style="display:none">
    <div class="upload-field">
      <textarea class="paste-area" id="paste-area" placeholder="drop a .d2 or .mmd file here, paste, or click browse..." spellcheck="false" aria-label="Diagram source"></textarea>
      <div class="paste-meta">
        <span class="paste-filename" id="paste-filename"></span>
        <button class="browse-btn" id="browse-btn">browse...</button>
        <input id="file-input" type="file" aria-label="Load a diagram file" accept=".d2,.mmd,.mermaid,text/plain" style="display:none" />
      </div>
    </div>
    <div class="upload-controls">
      <label>language
        <select id="up-lang">
          <option value="d2">d2</option>
          <option value="mermaid">mermaid</option>
        </select>
      </label>
      <button id="up-submit">render →</button>
      <span id="up-error" class="upload-error"></span>
    </div>
  </div>

  <!-- Editor + preview: the live view once a diagram is loaded -->
  <div class="layout" id="layout" style="display:none">
    <section class="editor">
      <div class="controls">
        <label>language
          <select id="lang">
            <option value="d2">d2</option>
            <option value="mermaid">mermaid</option>
          </select>
        </label>
        <div class="downloads">
          <button data-fmt="svg">svg</button>
          <button data-fmt="png">png</button>
          <button data-fmt="drawio">drawio</button>
        </div>
      </div>
      <textarea id="source" spellcheck="false" aria-label="Diagram source" placeholder="edit source, live preview updates..."></textarea>
    </section>

    <section class="preview">
      <div id="canvas" class="canvas"></div>
      <div id="error" class="error hidden"></div>
    </section>
  </div>

  <div id="status-bar">
    <span id="status-lang"></span>
    <span id="status-hints">edit source · live preview · download svg / png / drawio</span>
  </div>

  <script src="/app.js"></script>
</body>
</html>

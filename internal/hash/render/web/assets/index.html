<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>unum — Hash Deriver</title>
  <link rel="stylesheet" href="/shared.css" />
  <link rel="stylesheet" href="/style.css" />
  <script>window.UNUM_CONFIG={darkTheme:"{{.DarkTheme}}",lightTheme:"{{.LightTheme}}",version:"{{.Version}}",themes:{{.ThemeData}}};</script>
  <script src="/shared.js"></script>
</head>
<body>

  <div id="header">
    <span class="brand">[ UNUM ]</span>
    <span class="hdr-tool">hash deriver</span>
  </div>

  <div class="layout">
    <div class="main">
      <div class="input-row">
        <input id="hashInput" type="text" placeholder="enter text to hash..." autofocus />
        <button id="deriveBtn">derive</button>
      </div>

      <div id="results" class="results hidden">
        <table>
          <tbody id="resultBody"></tbody>
        </table>
      </div>

      <div id="empty" class="empty-hint">type something and press enter or click derive</div>
    </div>

    <aside class="sidebar">
      <div class="sidebar-title">history</div>
      <ul id="historyList" class="history-list"></ul>
    </aside>
  </div>

  <div id="status-bar">
    <span id="status-input"></span>
    <span id="status-hints">enter:derive · tab:switch · history in sidebar</span>
  </div>

  <script src="/app.js"></script>
</body>
</html>

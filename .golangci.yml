version: "2"

linters:
  default: standard
  enable:
    - dupl
    - cyclop
    - errorlint
    - gocognit
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - prealloc
    - thelper
    - unconvert
    - unparam
    - whitespace
    - wrapcheck
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    cyclop:
      max-complexity: 15
    gocognit:
      min-complexity: 20
    gosec:
      excludes:
        - G107
        - G115
        - G204
        - G304
        - G404
  exclusions:
    paths:
      - examples
    rules:
      - path: "tests/web/"
        linters:
          - noctx
      - path: "_test\\.go"
        linters:
          - wrapcheck
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    paths:
      - examples
  settings:
    goimports:
      local-prefixes:
        - github.com/danielriddell21/unum

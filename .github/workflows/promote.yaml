name: Promote Release

on:
  release:
    types: [released]

permissions:
  packages: write

jobs:
  retag:
    name: Retag image
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag as latest
        run: |
          VERSION=${{ github.event.release.tag_name }}
          docker pull ghcr.io/danielriddell21/unum:${VERSION}
          docker tag  ghcr.io/danielriddell21/unum:${VERSION} ghcr.io/danielriddell21/unum:latest
          docker push ghcr.io/danielriddell21/unum:latest

  update-manifests:
    name: Pin version in k8s-unum
    needs: retag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: danielriddell21/k8s-unum
          ref: trunk
          token: ${{ secrets.K8S_UNUM_TOKEN }}

      - name: Update image tag in deployments
        run: |
          VERSION=${{ github.event.release.tag_name }}
          find . -name "deployment.yaml" \
            -exec sed -i "s|ghcr.io/danielriddell21/unum:.*|ghcr.io/danielriddell21/unum:${VERSION}|g" {} \;

      - name: Commit and push
        run: |
          VERSION=${{ github.event.release.tag_name }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/
          git diff --staged --quiet || git commit -m "chore: deploy ${VERSION}"
          git push

name: Promote release to latest

on:
  release:
    types: [released]

permissions:
  packages: write

jobs:
  retag:
    name: Retag image as latest
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag as latest
        run: |
          VERSION=${{ github.event.release.tag_name }}
          docker pull ghcr.io/danielriddell21/unum:${VERSION}
          docker tag  ghcr.io/danielriddell21/unum:${VERSION} ghcr.io/danielriddell21/unum:latest
          docker push ghcr.io/danielriddell21/unum:latest

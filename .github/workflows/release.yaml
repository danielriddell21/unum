name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    uses: danielriddell21/github-actions/.github/workflows/release.yaml@v2
    permissions:
      contents: write
      packages: write
    with:
      # Answers the ldflags hook; letsgo.mod pins it by digest.
      plugins: letsgo-env
    secrets:
      tap-app-private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
      # Read by letsgo-env, which fails the release rather than compiling in an
      # empty value.
      otel-auth-token: ${{ secrets.OTEL_AUTH_TOKEN }}

name: CI

on:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["trunk"]

jobs:
  ci:
    uses: danielriddell21/github-actions/.github/workflows/ci.yaml@v2
    # Read is enough now. The tag job checks out and pushes with tag-token, so
    # the workflow token no longer needs to write anything here.
    permissions:
      contents: read
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}
      tag-token: ${{ secrets.UNUM_TOKEN }}
